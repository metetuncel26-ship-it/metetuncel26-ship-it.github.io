
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEGA GAMES</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10111b;color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#191a2b;padding:18px 5%;
 display:flex;align-items:center;
 justify-content:space-between;gap:15px;
 flex-wrap:wrap;
}
.logo{font-size:28px;font-weight:bold;color:#8b6cff}
input{
 padding:13px;border:0;border-radius:10px;
 width:250px;max-width:100%;
 background:#292a40;color:white;
}
nav{
 display:flex;gap:10px;overflow:auto;
 padding:15px 5%;background:#171827;
}
nav button,.play{
 background:#704cff;color:white;
 border:0;padding:12px 17px;
 border-radius:9px;cursor:pointer;
}
main{padding:25px 5%}
h2{margin-top:30px}
.hero{
 background:linear-gradient(120deg,#5030a5,#162d6a);
 padding:35px;border-radius:18px;
}
.hero h1{font-size:38px}
.games{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:18px;margin-top:20px;
}
.card{
 background:#202136;border-radius:15px;
 overflow:hidden;
 transition:.2s;
}
.card:hover{transform:translateY(-5px)}
.art{
 height:130px;display:grid;
 place-items:center;font-size:65px;
 background:#303151;
}
.info{padding:14px}
.info p{color:#aaa;font-size:13px}
.play{width:100%;margin-top:8px}
a{color:inherit;text-decoration:none}
footer{text-align:center;padding:35px;color:#888}
</style>
</head>
<body>

<header>
 <div class="logo">🎮 MEGA GAMES</div>
 <input id="search" placeholder="🔍 Search games..." oninput="render()">
</header>

<nav>
 <button onclick="category='All';render()">🏠 All</button>
 <button onclick="category='Action';render()">⚔️ Action</button>
 <button onclick="category='Racing';render()">🏎️ Racing</button>
 <button onclick="category='Puzzle';render()">🧩 Puzzle</button>
 <button onclick="category='Horror';render()">👻 Horror</button>
 <button onclick="category='Sports';render()">⚽ Sports</button>
</nav>

<main>
 <section class="hero">
  <h1>PLAY AMAZING GAMES.</h1>
  <p>Discover fun games from creators around the world.</p>
  <button class="play" onclick="document.getElementById('all').scrollIntoView()">EXPLORE GAMES ↓</button>
 </section>

 <h2>🔥 Featured Games</h2>
 <div class="games" id="featured"></div>

 <h2 id="all">🎮 Explore Games</h2>
 <div class="games" id="games"></div>
 <p id="empty"></p>
</main>

<footer>
 MEGA GAMES © 2026<br>
 A place to discover games.
</footer>

<script>
let category='All';

const games=[
 {name:'Slope',emoji:'🟢',type:'Action',url:'https://slopegame.com/'},
 {name:'2048',emoji:'🔢',type:'Puzzle',url:'https://play2048.co/'},
 {name:'Agar.io',emoji:'🔵',type:'Action',url:'https://agar.io/'},
 {name:'Little Alchemy 2',emoji:'🧪',type:'Puzzle',url:'https://littlealchemy2.com/'},
 {name:'Moto X3M',emoji:'🏍️',type:'Racing',url:'https://www.coolmathgames.com/0-moto-x3m'},
 {name:'Pac-Man',emoji:'👾',type:'Action',url:'https://www.google.com/search?q=play+pacman'},
 {name:'Chess',emoji:'♟️',type:'Puzzle',url:'https://www.chess.com/play'},
 {name:'Basketball Stars',emoji:'🏀',type:'Sports',url:'https://www.crazygames.com/game/basketball-stars'},
 {name:'Drift Hunters',emoji:'🚗',type:'Racing',url:'https://www.drifthunters.com/'},
 {name:'Granny',emoji:'👻',type:'Horror',url:'https://www.google.com/search?q=Granny+game'}
];

function card(g){
 return `
 <div class="card">
  <div class="art">${g.emoji}</div>
  <div class="info">
   <b>${g.name}</b>
   <p>${g.type} Game</p>
   <a href="${g.url}" target="_blank" rel="noopener noreferrer">
    <button class="play">PLAY NOW ▶</button>
   </a>
  </div>
 </div>`;
}

function render(){
 let query=document.getElementById('search').value.toLowerCase();
 let filtered=games.filter(g=>
  (category==='All'||g.type===category)&&
  g.name.toLowerCase().includes(query)
 );
 document.getElementById('games').innerHTML=filtered.map(card).join('');
 document.getElementById('empty').innerText=
  filtered.length?'':'No games found. Try another search!';
 document.getElementById('featured').innerHTML=
  games.slice(0,3).map(card).join('');
}
render();
</script>
</body>
</html>
